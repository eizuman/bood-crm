<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 174 52" width="174" height="52">
  <defs>
    <style>
      .lt { font-family: 'Cormorant Garamond', Georgia, serif; }
      .st { font-family: 'Inter', Arial, sans-serif; }
    </style>
  </defs>

  <!-- B -->
  <text x="1" y="38" class="lt" font-size="42" font-weight="600" fill="#F0EAD6">B</text>

  <!-- Infinity symbol (green) — two ellipses with crossover mask -->
  <!-- Left loop -->
  <ellipse cx="44" cy="20" rx="14" ry="10.5" fill="none" stroke="#4CAF50" stroke-width="2.6"/>
  <!-- Right loop -->
  <ellipse cx="70" cy="20" rx="14" ry="10.5" fill="none" stroke="#4CAF50" stroke-width="2.6"/>
  <!-- Crossover mask (bg colour so loops appear to cross) -->
  <rect x="51" y="9" width="12" height="22" fill="#0F0F0F"/>
  <!-- Left crossing arc (front stroke going ↘) -->
  <path d="M 51 11.5 Q 57 20 51 28.5" fill="none" stroke="#4CAF50" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Right crossing arc (back stroke going ↙, slightly dimmer to suggest depth) -->
  <path d="M 63 11.5 Q 57 20 63 28.5" fill="none" stroke="#4CAF50" stroke-width="2.6" stroke-linecap="round" opacity="0.7"/>

  <!-- D -->
  <text x="86" y="38" class="lt" font-size="42" font-weight="600" fill="#F0EAD6">D</text>

  <!-- Subtitle -->
  <text x="1" y="50" class="st" font-size="7.5" font-weight="300" fill="#9A8F7E" letter-spacing="1.8">brewing and distilling</text>
</svg>
