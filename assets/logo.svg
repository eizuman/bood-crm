<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" width="220" height="60">
  <defs>
    <style>
      .logo-text { font-family: 'Cormorant Garamond', Georgia, serif; }
      .sub-text { font-family: 'Inter', Arial, sans-serif; }
    </style>
  </defs>
  <!-- Infinity symbol styled as two overlapping loops -->
  <g transform="translate(10, 8)">
    <!-- Left loop of infinity -->
    <ellipse cx="16" cy="16" rx="12" ry="9" fill="none" stroke="#D4890A" stroke-width="2.5"/>
    <!-- Right loop of infinity -->
    <ellipse cx="36" cy="16" rx="12" ry="9" fill="none" stroke="#D4890A" stroke-width="2.5"/>
    <!-- Center overlap mask -->
    <rect x="22" y="7" width="8" height="18" fill="#1A1A1A"/>
    <!-- Center crossover lines -->
    <path d="M22 10 Q28 16 22 22" fill="none" stroke="#D4890A" stroke-width="2.5"/>
    <path d="M36 10 Q30 16 36 22" fill="none" stroke="#D4890A" stroke-width="2.5"/>
  </g>
  <!-- M text before infinity, RZINKA after -->
  <text x="58" y="30" class="logo-text" font-size="26" font-weight="700" fill="#F0EAD6" letter-spacing="2">M</text>
  <text x="76" y="30" class="logo-text" font-size="26" font-weight="700" fill="#F0EAD6" letter-spacing="2">RZINKA</text>
  <!-- Subtitle -->
  <text x="58" y="46" class="sub-text" font-size="9" font-weight="300" fill="#9A8F7E" letter-spacing="3">BREWING &amp; DISTILLING</text>
  <!-- Decorative line -->
  <line x1="58" y1="35" x2="210" y2="35" stroke="#D4890A" stroke-width="0.5" opacity="0.4"/>
</svg>
